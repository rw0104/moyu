[package]
name = "moyu"
version = "0.6.2"
description = "DeepSeek desktop translation with local memory"
authors = ["Moyu"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "moyu_translate_lib"
# This product targets desktop; avoid producing unused mobile/shared libraries.
crate-type = ["rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
